# Δημοσίευση της εφαρμογής στο GitHub Pages (https://<χρήστης>.github.io/SecondVision/)
# Μία φορά: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Αφαίρεση αρχείων που δεν χρειάζονται στο site
        run: rm -rf .git .github test tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
